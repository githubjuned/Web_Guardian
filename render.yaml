# Render Blueprint — deploys WebGuardian AI as one Docker web service on the FREE plan.
# Dashboard → New → Blueprint → select this repo. Then fill in GEMINI_API_KEY and PUBLIC_BASE_URL.
#
# Tested in a container limited like the free plan (512 MB RAM, 0.1 CPU): a full demo
# audit completes in ~2.5 minutes with peak memory ~420 MB. Lighthouse is disabled to
# stay within memory. On a paid plan (plan: standard) you can set LIGHTHOUSE_ENABLED=true
# and add a persistent disk mounted at /app/backend/data.
services:
  - type: web
    name: webguardian-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set in the dashboard; never committed
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://webguardian-ai.onrender.com
      - key: MAX_CONCURRENT_AUDITS
        value: "1"
      - key: LIGHTHOUSE_ENABLED
        value: "false"
      - key: NAVIGATION_TIMEOUT_MS
        value: "60000"
