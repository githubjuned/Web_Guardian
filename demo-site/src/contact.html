<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Brewly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">B</span>Brewly</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn menu-toggle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
      </div>
    </div>
  </header>

  <main class="container page">
    <h1>Talk to a human</h1>
    <p class="lead">Questions about your subscription, wholesale or brewing? We reply within one business day.</p>

    <form class="contact-form" action="#" onsubmit="return false;">
      <input type="text" name="name" placeholder="Your name">
      <input type="email" name="email" placeholder="Email address">
      <select name="topic">
        <option>Subscription</option>
        <option>Wholesale</option>
        <option>Brewing help</option>
      </select>
      <textarea name="message" rows="5" placeholder="How can we help?"></textarea>
      <button type="submit" class="btn btn-primary">Send message</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-brand">Brewly Coffee Co.</p>
      <p class="footer-small">© 2026 Brewly Coffee Co. · 221 Roastery Lane, Portland, OR · All prices in USD.</p>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
